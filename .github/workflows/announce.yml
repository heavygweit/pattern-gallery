name: announce
# Uploads newly pushed patterns to R2 (served at patterns.uno.fun) and posts
# them to Slack #patterns as inline images. Deterministic transport — no model
# involved. The commit message body of the push becomes the text of the post.
#
# Secrets:
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — scoped token, uno-images bucket
#   SLACK_USER_TOKEN — xoxp user token (posts as Erica), user scope chat:write
on:
  push:
    branches: [main]
    paths: ["patterns/*.png"]
  workflow_dispatch:
    inputs:
      backfill:
        description: "re-upload every PNG to R2 (no Slack post)"
        type: boolean
        default: false

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: 0bc82bff4439c556f9dc1b054d2de6d7
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine new patterns
        id: new
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            ls patterns/*.png > new.txt
          else
            b="$BEFORE"; [ -z "${b//0/}" ] && b="$AFTER^"
            git diff --name-only --diff-filter=A "$b" "$AFTER" \
              | grep '^patterns/.*\.png$' | sort > new.txt || true
          fi
          echo "count=$(wc -l < new.txt)" >> "$GITHUB_OUTPUT"
          cat new.txt

      - name: Upload to R2
        if: steps.new.outputs.count != '0'
        run: |
          while read -r p; do
            aws s3 cp "$p" "s3://uno-images/patterns/$(basename "$p")" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type image/png \
              --cache-control "public, max-age=31536000, immutable"
          done < new.txt

      - name: Post to Slack
        if: steps.new.outputs.count != '0' && github.event_name == 'push'
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          new = [l.strip() for l in open("new.txt") if l.strip()]
          msg = subprocess.run(["git", "log", "-1", "--format=%B", os.environ["AFTER"]],
                               capture_output=True, text=True, check=True).stdout.strip()
          blocks = [{"type": "section",
                     "text": {"type": "mrkdwn", "text": msg or "new patterns"}}]
          for p in new[:45]:                  # Slack caps a message at 50 blocks
              name = os.path.basename(p)[:-4]
              blocks.append({
                  "type": "image",
                  "image_url": f"https://patterns.uno.fun/patterns/{name}.png",
                  "alt_text": name,
                  "title": {"type": "plain_text", "text": name},
              })
          if len(new) > 45:
              blocks.append({"type": "section", "text": {
                  "type": "mrkdwn", "text": f"…and {len(new)-45} more."}})

          body = json.dumps({"channel": "C0BQ989J2QJ",
                             "text": msg or "new patterns",
                             "blocks": blocks}).encode()
          req = urllib.request.Request("https://slack.com/api/chat.postMessage",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8",
                       "Authorization": "Bearer " + os.environ["SLACK_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as r:
              d = json.load(r)
          print("slack ok:", d.get("ok"), d.get("error", ""))
          raise SystemExit(0 if d.get("ok") else 1)
          PY
